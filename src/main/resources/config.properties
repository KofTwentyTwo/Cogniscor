# Cogniscor Configuration File

# HTTP Client Settings
http.timeout.seconds=30
http.user.agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
http.max.redirects=5

# Rate Limiting
rate.limit.delay.ms=2000
rate.limit.enabled=true

# Scraping Settings
scraper.max.retries=3
scraper.retry.delay.ms=5000

# Output Settings
output.base.dir=./data
output.create.examples=true

# API Keys (Optional - for enhanced data collection)
# linkedin.api.key=
# crunchbase.api.key=
# glassdoor.api.key=

# OpenAI API Configuration (Required for LLM-enhanced analysis)
openai.api.key=
openai.model=gpt-4o-mini
openai.max.tokens=4000
openai.temperature=0.3

# LLM Features (can be disabled individually)
llm.enabled=true
llm.verify.company=true
llm.discover.urls=true
llm.recover.failures=true
llm.enhance.extraction=true
llm.review.reports=true

# Logging Level (TRACE, DEBUG, INFO, WARN, ERROR)
log.level=INFO

# Analysis Settings
analyzer.min.content.length=100
analyzer.max.summary.words=500
analyzer.executive.summary.max.words=800

# Search Settings
search.max.results=10
search.include.news=true
search.include.wikipedia=true
